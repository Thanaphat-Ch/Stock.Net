version: "3.8"

services:
  web-api:
    container_name: MyFirstApi.Net-api
    build:
      context: .                          
      dockerfile: MyFirstApi/Dockerfile     
    ports:
      - "8080:8080"                     
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    restart: unless-stopped