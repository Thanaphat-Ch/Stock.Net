name: .NET CI & Docker Build

permissions:
  contents: read
  packages: write
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Check Code Formatting (Lint)
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Run Unit Tests
        run: dotnet test --no-restore --verbosity normal

  docker-compose-build:
    name: Build & Verify with Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Images using Docker Compose
        run: docker compose build

      - name: Start Services & Verify (Optional)
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          # ลองยิง request ไปที่ port 8080 (ถ้ามี health endpoint หรือ route พื้นฐาน)
          curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/

      - name: Teardown Services
        if: always()
        run: docker compose down --volumes

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & Push Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # เปลี่ยนชื่อ Repo ให้เป็นตัวพิมพ์เล็ก
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_IMAGE="ghcr.io/$REPO_LOWER/dotnet-api"

          # ค้นหาชื่อ Local Image ที่เพิ่ง build มาจาก Compose (ดึง image ล่าสุดที่เพิ่งสร้างขึ้นมา หรือระบุชื่อตรงๆ แทนได้)
          LOCAL_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | head -n 1)

          echo "Tagging $LOCAL_IMAGE -> $TARGET_IMAGE"

          # แปะป้ายแท็ก GHCR โดยไม่ต้องบิลด์ใหม่
          docker tag $LOCAL_IMAGE $TARGET_IMAGE:latest
          docker tag $LOCAL_IMAGE $TARGET_IMAGE:${{ github.sha }}

          # Push ขึ้น GHCR
          docker push $TARGET_IMAGE:latest
          docker push $TARGET_IMAGE:${{ github.sha }}

      - name: Trigger Render Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

     
