name: .NET CI & Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Check Code Formatting (Lint)
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Run Unit Tests
        run: dotnet test --no-restore --verbosity normal

  docker-compose-build:
    name: Build & Verify with Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Images using Docker Compose
        run: docker compose build

      - name: Start Services & Verify (Optional)
        run: |
          docker compose up -d
          # ตรวจสอบสถานะว่า container รันขึ้นมาได้ ไม่ crash
          docker compose ps
          # ลองยิง request ไปที่ port 8080 (ถ้ามี health endpoint หรือ route พื้นฐาน)
          curl --fail http://localhost:8080/weatherforecast || exit 1
          # ปิด container และเคลียร์ resource
          docker compose down